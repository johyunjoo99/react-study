<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구조 분해 할당 (Destructuring)</title>

    <link rel="stylesheet" href="../../src/styles/css/style.css">
</head>
<body>
    <div class="example">
        <h1>02. 구조 분해 할당 (Destructuring)</h1>

        <!-- 코드 출력 영역 -->
        <pre class="example-code">
            <code id="codeView"></code>
        </pre>

        <a href="./index.html" class="back">목록으로 이동<span>→</span></a>
    </div>
    <script id="exampleCode">  
        // 배열의 순서(인덱스)가 이미 정해져 있고, 그 순서대로 의미가 있는 값을 꺼낼 때 사용

        let person = {
            name: "현주",
            age: 28,
        }


        // 구 버전
        // let name = person.name
        // let age = person['age']


        // ES6 버전
        // Person이라는 객체에서 name, age라는 키값을 분해해서 let이라는 변수로 선언한다 라는 뜻
        let {name, age} = person

        console.log("name: ", name, "age: ", age);


        // 배열
        let array = [1, 2, 3, 4]
        let [a, b] = array
        let [c, d,...rest] = array
        
        console.log("a: ", a, "/ b: ", b);
        console.log("rest: ", rest);
    </script>
    <script src="./js/code_view.js"></script>
</body>
</html>
